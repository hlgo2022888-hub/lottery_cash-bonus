<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026花蓮購物節 - 加碼抽獎</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Microsoft JhengHei', 'Noto Sans TC', sans-serif;
      background: linear-gradient(135deg, #8B0000 0%, #a82020 50%, #D4AF37 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    .glow-btn {
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
      transition: all 0.3s ease;
    }
    .glow-btn:hover {
      box-shadow: 0 0 30px rgba(255, 215, 0, 1);
      transform: scale(1.05);
    }
    .glow-btn:disabled {
      filter: grayscale(100%);
      transform: scale(1);
      box-shadow: none;
      cursor: not-allowed;
    }

    .pulse-lock {
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; box-shadow: 0 0 5px #FFD700; }
      50% { transform: scale(1.15); opacity: 1; box-shadow: 0 0 20px #FFD700; }
      100% { transform: scale(1); opacity: 0.8; box-shadow: 0 0 5px #FFD700; }
    }

    .float-envelope {
      animation: floating 3s ease-in-out infinite;
    }
    @keyframes floating {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
      100% { transform: translateY(0px); }
    }
    /* 為 7 個紅包設定延遲 */
    .delay-1 { animation-delay: 0s; }
    .delay-2 { animation-delay: 0.2s; }
    .delay-3 { animation-delay: 0.4s; }
    .delay-4 { animation-delay: 0.6s; }
    .delay-5 { animation-delay: 0.8s; }
    .delay-6 { animation-delay: 1.0s; }
    .delay-7 { animation-delay: 1.2s; }

    /* 抽獎箱動畫設定 */
    .ball-bounce { animation: bounce 0.6s infinite alternate cubic-bezier(0.5, 0.05, 1, 0.5); }
    .b-delay-1 { animation-delay: 0.1s; }
    .b-delay-2 { animation-delay: 0.3s; }
    .b-delay-3 { animation-delay: 0.5s; }
    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-50px); }
    }
    .box-shake { animation: shake 0.4s infinite; }
    @keyframes shake {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      25% { transform: translateX(-3px) rotate(-2deg); }
      75% { transform: translateX(3px) rotate(2deg); }
    }

    .flip-card {
      perspective: 1000px;
      height: 170px;
    }
    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
    }
    .flip-card.flipped .flip-card-inner {
      transform: rotateY(180deg);
    }
    .flip-card-front, .flip-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    .flip-card-front {
      background: linear-gradient(135deg, #d32f2f, #b71c1c);
      border: 2px solid #FFD700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .golden-text {
      color: #FFD700;
      font-size: 2.5rem;
      font-weight: bold;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    }
    .flip-card-back {
      background-color: #ffffff;
      transform: rotateY(180deg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem 0.5rem;
      border: 3px solid #FFD700;
      position: relative;
    }
    
    /* Stamp 徽章設計 */
    .stamp-badge {
      position: absolute;
      top: -8px;
      left: -8px;
      background: linear-gradient(135deg, #4f46e5, #3730a3);
      color: white;
      font-size: 0.75rem;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 6px;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
      transform: rotate(-10deg);
      border: 2px solid white;
      z-index: 20;
      white-space: nowrap;
    }
    .stamp-1st { background: linear-gradient(135deg, #ef4444, #b91c1c); }
    .stamp-2nd { background: linear-gradient(135deg, #f59e0b, #d97706); }
  </style>
</head>
<body class="text-white relative flex flex-col min-h-screen">

  <!-- ================= 抽獎動畫遮罩 (預設隱藏) ================= -->
  <div id="loadingOverlay" class="fixed inset-0 z-50 flex-col items-center justify-center bg-black/85 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300">
    <div class="relative w-40 h-40 mb-6">
      <!-- 彈跳彩球 -->
      <div class="absolute bottom-12 left-6 w-8 h-8 rounded-full bg-gradient-to-br from-yellow-300 to-yellow-600 shadow-lg ball-bounce b-delay-1 flex items-center justify-center"><span class="text-[10px] font-bold text-red-900">獎</span></div>
      <div class="absolute bottom-12 left-16 w-8 h-8 rounded-full bg-gradient-to-br from-red-400 to-red-600 shadow-lg ball-bounce b-delay-2 flex items-center justify-center"><span class="text-[10px] font-bold text-white">抽</span></div>
      <div class="absolute bottom-12 right-6 w-8 h-8 rounded-full bg-gradient-to-br from-blue-300 to-blue-600 shadow-lg ball-bounce b-delay-3 flex items-center justify-center"><span class="text-[10px] font-bold text-white">中</span></div>
      <!-- 震動抽獎箱 -->
      <div class="absolute bottom-0 w-full h-20 bg-gradient-to-b from-red-700 to-red-900 border-4 border-yellow-500 rounded-b-xl flex items-center justify-center box-shake shadow-[0_0_20px_rgba(255,215,0,0.4)] z-10">
        <span class="text-yellow-400 font-bold tracking-widest text-lg drop-shadow-md">抽獎箱</span>
      </div>
      <!-- 抽獎箱開口陰影 -->
      <div class="absolute bottom-20 w-full h-4 bg-black/60 rounded-full blur-sm box-shake z-0"></div>
    </div>
    <h3 class="text-2xl font-bold text-yellow-400 animate-pulse tracking-widest drop-shadow-[0_0_10px_rgba(255,215,0,0.8)]">連線洗牌中，請稍候...</h3>
  </div>

  <header class="w-full pt-8 px-4 flex justify-center mb-8">
    <div class="w-full md:w-4/5 max-w-6xl flex items-center justify-center">
      <!-- 加入 onerror 容錯機制，無論副檔名是 .jpg 還是 .png 還是 .PNG 都能抓到 -->
      <img src="banner.jpg" onerror="this.onerror=null; this.src='banner.png'; this.onerror=function(){this.src='Banner.PNG'}" alt="2026花蓮購物節活動Banner" class="w-full h-auto object-contain drop-shadow-2xl rounded-xl">
    </div>
  </header>

  <!-- 7 個進度節點 (包含 3.5 億) -->
  <section class="max-w-6xl mx-auto w-full px-4 mb-10">
    <div class="bg-black/50 rounded-full p-4 sm:p-6 flex justify-between items-center relative shadow-inner overflow-hidden">
      <div class="absolute left-8 right-8 top-1/2 h-2 bg-yellow-500 -z-10 transform -translate-y-1/2 rounded-full"></div>
      <script>
        const milestones = ['5,000萬', '1億元', '1.5億元', '2億元', '2.5億元', '3億元', '3.5億元'];
        milestones.forEach(m => {
          document.write(`
            <div class="flex flex-col items-center z-10">
              <div class="w-8 h-8 sm:w-12 sm:h-12 bg-red-700 border-2 border-yellow-500 rounded-full flex items-center justify-center mb-1 sm:mb-2 pulse-lock bg-gradient-to-br from-red-500 to-red-800">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 sm:h-6 sm:w-6 text-yellow-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z" />
                </svg>
              </div>
              <span class="text-yellow-400 font-bold text-xs sm:text-sm tracking-wider bg-black/70 px-1 sm:px-2 py-0.5 sm:py-1 rounded-full border border-yellow-600/50 hidden sm:block">${m}</span>
              <span class="text-yellow-400 font-bold text-[10px] bg-black/70 px-1 py-0.5 rounded-full sm:hidden">${m.replace('元','').replace('萬','W')}</span>
            </div>
          `);
        });
      </script>
    </div>
  </section>

  <section class="text-center mb-10 relative">
    <button id="drawBtn" class="glow-btn bg-gradient-to-r from-yellow-500 via-yellow-400 to-yellow-500 text-red-900 font-bold text-3xl py-4 px-16 rounded-full tracking-widest border-2 border-white z-20 relative">
      立即抽獎
    </button>
  </section>

  <!-- 待機紅包 7 個 -->
  <section id="preDrawEnvelopes" class="max-w-6xl mx-auto w-full px-2 md:px-4 mb-12 flex flex-nowrap justify-between gap-1 sm:gap-4 transition-opacity duration-500">
    <script>
      const envTexts = ['5仟萬<br>加碼獎', '1億<br>加碼獎', '1.5億<br>加碼獎', '2億<br>加碼獎', '2.5億<br>加碼獎', '3億<br>加碼獎', '3.5億<br>加碼獎'];
      envTexts.forEach((text, i) => {
        document.write(`
          <div class="flex-1 max-w-[140px] aspect-[2/3] bg-gradient-to-br from-red-600 to-red-800 rounded-lg border-2 border-yellow-400 flex items-center justify-center shadow-2xl float-envelope delay-${i+1}">
            <div class="w-full h-full border-2 border-dashed border-yellow-500/50 m-1 md:m-1.5 flex flex-col items-center justify-center rounded p-1 text-center">
              <span class="text-yellow-400 text-[10px] sm:text-base md:text-xl font-bold leading-tight tracking-wider drop-shadow-md">${text}</span>
            </div>
          </div>
        `);
      });
    </script>
  </section>

  <section id="resultsContainer" class="max-w-6xl mx-auto w-full px-4 grid grid-cols-1 gap-8 hidden pb-10">
    <!-- JS 將會在此動態插入獎項區塊 -->
  </section>

  <div class="mt-auto">
    <footer class="text-center pb-8 text-sm text-yellow-100/80 tracking-wide">
      <p>正式中獎名單將公告於花蓮購物節官方網站</p>
      <!-- 更新為花蓮縣政府廣告 -->
      <p class="mt-1">相關訊息以官方網站公告為準。 | 花蓮縣政府廣告</p>
    </footer>

    <!-- 極遠距離的重置按鈕 -->
    <div class="mt-32 mb-4 pr-4 flex justify-end">
      <button id="resetBtn" class="bg-black/30 hover:bg-black/60 text-yellow-600/40 hover:text-yellow-500 border border-yellow-600/30 hover:border-yellow-500/50 px-2 py-1 rounded text-[10px] cursor-pointer transition-all duration-300 flex items-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        重置
      </button>
    </div>
  </div>

  <script>
    // 真實 GAS API 網址
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbwpWTLXzBymoza2PIHS9Cik9azcvMfTSTMFeSh7bA6bBu5WYni2JuZUQFj7xCpvrFzr/exec';

    const drawBtn = document.getElementById('drawBtn');
    const resetBtn = document.getElementById('resetBtn');
    const resultsContainer = document.getElementById('resultsContainer');
    const preDrawEnvelopes = document.getElementById('preDrawEnvelopes');
    const loadingOverlay = document.getElementById('loadingOverlay');
    
    let timeoutIds = [];
    
    // 7 個獎項門檻配置
    const prizeTiersConfig = [
      { name: '5仟萬元 加碼獎', param: '5000萬' },
      { name: '1億元 加碼獎', param: '1億' },
      { name: '1.5億元 加碼獎', param: '1.5億' },
      { name: '2億元 加碼獎', param: '2億' },
      { name: '2.5億元 加碼獎', param: '2.5億' },
      { name: '3億元 加碼獎', param: '3億' },
      { name: '3.5億元 加碼獎', param: '3.5億' }
    ];

    const prizeData = [
      { label: '首獎 30,000', class: 'stamp-1st' },
      { label: '貳獎 20,000', class: 'stamp-2nd' },
      { label: '參獎 10,000', class: '' },
      { label: '參獎 10,000', class: '' }
    ];

    // 姓名遮蔽
    function maskName(name) {
      if (!name) return '未知';
      if (name.length <= 2) return name.charAt(0) + 'Ｏ';
      return name.charAt(0) + 'Ｏ' + name.charAt(name.length - 1);
    }

    // 電話遮蔽
    function maskPhone(phone) {
      if (!phone) return '未知';
      let pStr = String(phone).trim();
      
      // 防呆：修復 Google Sheet 把開頭 0 吃掉的問題 (例如 966685800 自動補回 0966685800)
      if (pStr.length === 9 && pStr.startsWith('9')) {
        pStr = '0' + pStr;
      }
      
      if (pStr.length >= 10) {
        return `${pStr.substring(0, 4)}-XXX${pStr.substring(pStr.length - 3)}`;
      }
      
      // 強制容錯：就算號碼長度真的很奇怪，也要確保有遮蔽，絕不露出原碼
      if (pStr.length > 4) {
        const mid = Math.floor(pStr.length / 2);
        return `${pStr.substring(0, mid - 1)}XXX${pStr.substring(mid + 2)}`;
      }
      
      return pStr;
    }
    
    // 顯示 Loading 動畫
    function showLoading() {
      loadingOverlay.classList.remove('hidden');
      loadingOverlay.style.display = 'flex';
      setTimeout(() => {
        loadingOverlay.classList.remove('opacity-0');
      }, 10);
    }

    // 隱藏 Loading 動畫
    function hideLoading() {
      loadingOverlay.classList.add('opacity-0');
      setTimeout(() => {
        loadingOverlay.classList.add('hidden');
        loadingOverlay.style.display = 'none';
      }, 300);
    }

    drawBtn.addEventListener('click', async function() {
      this.disabled = true;
      this.innerText = '連線抽取中...';
      preDrawEnvelopes.classList.add('hidden');
      resetBtn.style.pointerEvents = 'none';
      
      resultsContainer.innerHTML = '';
      resultsContainer.classList.remove('hidden');

      // 開啟抽獎箱全螢幕動畫
      showLoading();

      try {
        // 並發 7 個請求加速資料抓取，務必加入 redirect: 'follow' 來處理 GAS 的跨域轉址
        const fetchPromises = prizeTiersConfig.map(tier => 
          fetch(`${GAS_API_URL}?level=${encodeURIComponent(tier.param)}`, {
            method: 'GET',
            redirect: 'follow'
          })
            .then(res => {
              if (!res.ok) throw new Error(`API 伺服器回應錯誤 (HTTP ${res.status})`);
              return res.json();
            })
            .then(data => {
              if(data.error) throw new Error(`${tier.name} 發生錯誤: ${data.error}`);
              if(!Array.isArray(data) || data.length === 0) {
                throw new Error(`${tier.name} 無法取得抽獎名單，請確認試算表內是否有資料。`);
              }
              return { tierName: tier.name, winners: data };
            })
        );

        const allResults = await Promise.all(fetchPromises);
        
        // 成功取得所有資料，關閉 loading 動畫
        hideLoading();
        this.innerText = '開獎中...';

        allResults.forEach((result, tierIndex) => {
          if(result.winners.error) {
            console.error(`${result.tierName} 發生錯誤:`, result.winners.error);
            return;
          }

          const sectionDiv = document.createElement('div');
          sectionDiv.className = 'bg-black/40 p-6 rounded-2xl border border-yellow-500/40 shadow-lg';
          
          const titleHTML = `
            <div class="flex items-center mb-6">
              <div class="w-2 h-8 bg-yellow-400 mr-3 rounded-full"></div>
              <h2 class="text-2xl text-yellow-400 font-bold tracking-wider">${result.tierName}</h2>
            </div>
          `;
          
          const cardsGrid = document.createElement('div');
          cardsGrid.className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6';
          
          sectionDiv.innerHTML = titleHTML;
          sectionDiv.appendChild(cardsGrid);
          resultsContainer.appendChild(sectionDiv);

          result.winners.forEach((winner, winnerIndex) => {
            const cardDiv = document.createElement('div');
            cardDiv.className = 'flip-card';
            
            const prizeInfo = prizeData[winnerIndex];
            const safeName = maskName(winner.name);
            const safePhone = maskPhone(winner.phone);
            const safeId = winner.id || '無編號';
            const safeStore = winner.store || '未知店家';

            cardDiv.innerHTML = `
              <div class="flip-card-inner">
                <div class="flip-card-front">
                  <div class="w-full h-full flex flex-col items-center justify-center border-4 border-double border-yellow-500/70 rounded-xl m-1">
                    <span class="golden-text">抽</span>
                  </div>
                </div>
                <div class="flip-card-back rounded-xl">
                  <!-- Stamp 徽章標示 -->
                  <div class="stamp-badge ${prizeInfo.class}">${prizeInfo.label}</div>
                  
                  <div class="flex flex-col h-full w-full justify-between items-center py-2 px-1">
                    <div class="text-xs text-gray-500 font-mono bg-gray-100 rounded px-2 py-1">${safeId}</div>
                    <div class="text-center my-auto">
                      <div class="text-xl font-bold text-red-700 mb-1 tracking-widest">${safeName}</div>
                      <div class="text-sm font-bold text-gray-800 tracking-wider">${safePhone}</div>
                    </div>
                    <div class="w-full text-xs text-yellow-900 bg-yellow-100/80 rounded border border-yellow-300 px-2 py-1.5 truncate text-center">
                      📍 ${safeStore}
                    </div>
                  </div>
                </div>
              </div>
            `;
            cardsGrid.appendChild(cardDiv);

            const totalCardIndex = (tierIndex * 4) + winnerIndex;
            const delay = totalCardIndex * 150 + 500; 
            
            const tId = setTimeout(() => {
              cardDiv.classList.add('flipped');
            }, delay); 
            timeoutIds.push(tId);
          });
        });

        const totalCards = 7 * 4;
        const totalAnimationTime = (totalCards * 150) + 500 + 800; 
        
        const btnTid = setTimeout(() => {
          drawBtn.innerText = '開獎完成';
          resetBtn.style.pointerEvents = 'auto';
        }, totalAnimationTime);
        timeoutIds.push(btnTid);

      } catch (error) {
        // 發生錯誤，關閉 loading 動畫
        hideLoading();
        
        alert('【抽獎程序中斷】\n' + error.message + '\n\n請檢查 Google Sheet 格式或聯繫系統管理員。');
        console.error('[真實 API 錯誤]', error);
        
        // 發生錯誤，將畫面與按鈕還原為初始狀態
        this.disabled = false;
        this.innerText = '立即抽獎';
        preDrawEnvelopes.classList.remove('hidden');
        resultsContainer.classList.add('hidden');
        resultsContainer.innerHTML = '';
        resetBtn.style.pointerEvents = 'auto';
      }
    });

    resetBtn.addEventListener('click', function() {
      timeoutIds.forEach(id => clearTimeout(id));
      timeoutIds = [];

      resultsContainer.classList.add('hidden');
      resultsContainer.innerHTML = '';
      
      drawBtn.disabled = false;
      drawBtn.innerText = '立即抽獎';
      
      preDrawEnvelopes.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>
</body>
</html>
